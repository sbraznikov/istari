# The pipeline of this repository (istari spec section 12). Versioned with
# the code; values here override the installation's [defaults].

[limits]
max_attempts = 3
max_review_rounds = 3
max_size = "L"                        # larger tickets are split before work starts
questions = "decide"                  # or "hold"
max_assumptions = 3
self_review = true

[checks]                              # run by istari, not by an agent
{{checks}}
verify_red = true                     # a new test must fail on the code of the previous checkpoint

[merge]
irreversible_paths = ["migrations/**", "api/**", "deploy/**"{{irreversible}}]

[[stage]]
name = "refine"
role = "refiner"
standard = ".istari/ticket-standard.md"

[[stage]]
name = "plan"
role = "planner"
gate = false                          # true: the implementer waits for a human to approve the plan

[[stage]]
name = "implement"
role = "implementer"
needs = ["plan"]
isolation = "worktree"
timeout = "45m"

[[stage]]
name = "review"
role = "reviewer"
needs = ["implement"]

[[stage]]
name = "approve"
kind = "human"
via = "github_review"
