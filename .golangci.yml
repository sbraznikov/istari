version: "2"

# The linters CI and istari's lint check run (CODING_STANDARDS.md S0.1).
linters:
  default: none
  enable:
    - staticcheck
    - unused # staticcheck's U1000 (unused code), a linter of its own in golangci-lint
    - errcheck
    - nolintlint
    - forbidigo
  settings:
    forbidigo:
      # A cmd/istari test whose outcome depends on a pass of the daemon's
      # loops steps them (CODING_STANDARDS S7.10); exclusions keep the rule
      # to those tests.
      forbid:
        - pattern: ^startDaemon$
          msg: "start the daemon stepped (CODING_STANDARDS S7.10), or say why it may run free with //nolint:forbidigo // <why>"
    nolintlint:
      # Every //nolint names its linter and says why: //nolint:errcheck // <why>.
      require-explanation: true
      require-specific: true
    errcheck:
      # Calls whose error never matters. Any other dropped error is handled,
      # or marked where it occurs with //nolint:errcheck // <why>.
      exclude-functions:
        # Output to a command's terminal, an HTTP response or an event
        # stream: when the write fails there is no one left to tell.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # A failed write to an HTTP response means the client went away; the
        # handler has no one to report it to.
        - (net/http.ResponseWriter).Write
        # Closing a response body that was read: the body's content and its
        # read errors are what count, and closing it cannot lose data.
        - (io.ReadCloser).Close
        # The deferred rollback after Commit returns sql.ErrTxDone; after a
        # failure the error that caused it is the one returned.
        - (*database/sql.Tx).Rollback
        # rows.Err reports what went wrong while iterating; Close adds nothing.
        - (*database/sql.Rows).Close
  exclusions:
    rules:
      # forbidigo's startDaemon rule is for the tests of cmd/istari only.
      - path-except: ^cmd/istari/.*_test\.go$
        linters:
          - forbidigo
