<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1032 272" width="1032" height="272" role="img" aria-label="A task moves from waiting to ready, claimed and completed; after a failure it returns to ready, and after the third failure the ticket is held until a human retries">
<title>A task moves from waiting to ready, claimed and completed; after a failure it returns to ready, and after the third failure the ticket is held until a human retries</title>
<style>
.bg{fill:#ffffff}
.bx{fill:#f3f5f2;stroke:#c9d1cc;stroke-width:1.5}
.bx-a{fill:#dcecea;stroke:#0d6b68;stroke-width:1.5}
.bx-h{fill:#f5ead2;stroke:#a9770f;stroke-width:1.5}
.bx-d{fill:none;stroke:#5d6b67;stroke-width:1.3;stroke-dasharray:5 4}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1b2422}
.nm{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tt{font-weight:600;font-size:12.5px}
.sb{font-size:11.5px;fill:#5d6b67}
.wa{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d6b68}
.wh{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a9770f}
.wc{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5d6b67}
.lb{font-size:11.5px}
.ar{fill:none;stroke:#1b2422;stroke-width:1.4}
.ab{fill:none;stroke:#7f8c88;stroke-width:1.4}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2422"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8c88"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1032" height="272" rx="8"/>
<rect class="bx" x="20" y="56" width="160" height="52" rx="5"/>
<rect class="bx" x="270" y="56" width="160" height="52" rx="5"/>
<rect class="bx-a" x="520" y="56" width="160" height="52" rx="5"/>
<rect class="bx" x="770" y="56" width="160" height="52" rx="5"/>
<rect class="bx" x="520" y="176" width="160" height="52" rx="5"/>
<rect class="bx-h" x="770" y="176" width="210" height="52" rx="5"/>
<text class="nm" x="100" y="79" text-anchor="middle">waiting</text>
<text class="sb" x="100" y="96" text-anchor="middle">waits for earlier stages</text>
<text class="nm" x="350" y="79" text-anchor="middle">ready</text>
<text class="sb" x="350" y="96" text-anchor="middle">in the queue</text>
<text class="nm" x="600" y="79" text-anchor="middle">claimed</text>
<text class="sb" x="600" y="96" text-anchor="middle">a run is in progress</text>
<text class="nm" x="850" y="79" text-anchor="middle">completed</text>
<text class="sb" x="850" y="96" text-anchor="middle">opens the next stage</text>
<text class="nm" x="600" y="199" text-anchor="middle">failed</text>
<text class="sb" x="600" y="216" text-anchor="middle">an attempt is spent</text>
<text class="nm" x="875" y="199" text-anchor="middle">hold: attempts_exhausted</text>
<text class="sb" x="875" y="216" text-anchor="middle">cleared by a human: retry</text>
<g class="ar" marker-end="url(#a)"><path d="M181,82 H269"/><path d="M431,82 H519"/><path d="M681,82 H769"/><path d="M600,108 V175"/><path d="M681,202 H769"/></g>
<text class="lb" x="225" y="74" text-anchor="middle">needs done</text>
<text class="lb" x="475" y="74" text-anchor="middle">claim</text>
<text class="lb" x="725" y="74" text-anchor="middle">complete</text>
<text class="lb" x="725" y="194" text-anchor="middle">3 of 3</text>
<text class="lb" x="435" y="194" text-anchor="middle">fewer than 3 attempts</text>
<text class="lb" x="475" y="16" text-anchor="middle">lease expired, or a failure that is not the agent's · no attempt spent</text>
<text class="lb" x="608" y="146" text-anchor="start">fail</text>
<g class="ab" marker-end="url(#b)"><path d="M519,202 H350 V110"/><path d="M600,56 C600,18 350,18 350,54"/></g>
</svg>
