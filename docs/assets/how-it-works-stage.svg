<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 1152 216" width="1152" height="216" role="img" aria-label="Code assembles the brief, the agent works and submits a structured result, code checks it and either changes the ticket state or refuses it back to the agent">
<title>Code assembles the brief, the agent works and submits a structured result, code checks it and either changes the ticket state or refuses it back to the agent</title>
<style>
.bg{fill:#ffffff}
.bx{fill:#f3f5f2;stroke:#c9d1cc;stroke-width:1.5}
.bx-a{fill:#dcecea;stroke:#0d6b68;stroke-width:1.5}
.bx-h{fill:#f5ead2;stroke:#a9770f;stroke-width:1.5}
.bx-d{fill:none;stroke:#5d6b67;stroke-width:1.3;stroke-dasharray:5 4}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1b2422}
.nm{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tt{font-weight:600;font-size:12.5px}
.sb{font-size:11.5px;fill:#5d6b67}
.wa{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#0d6b68}
.wh{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a9770f}
.wc{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#5d6b67}
.lb{font-size:11.5px}
.ar{fill:none;stroke:#1b2422;stroke-width:1.4}
.ab{fill:none;stroke:#7f8c88;stroke-width:1.4}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2422"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7f8c88"/></marker>
</defs>
<rect class="bg" x="-16" y="-16" width="1152" height="216" rx="8"/>
<rect class="bx" x="13" y="40" width="190" height="84" rx="5"/>
<text class="tt" x="108" y="70" text-anchor="middle">Code assembles the brief</text>
<text class="sb" x="108" y="90" text-anchor="middle">ticket, journal, diff,</text>
<text class="sb" x="108" y="105" text-anchor="middle">role instructions</text>
<path class="ar" d="M204,82 H238" marker-end="url(#a)"/>
<rect class="bx-a" x="239" y="40" width="190" height="84" rx="5"/>
<text class="tt" x="334" y="70" text-anchor="middle">The agent works</text>
<text class="sb" x="334" y="90" text-anchor="middle">in the worktree</text>
<text class="sb" x="334" y="105" text-anchor="middle">of its own ticket</text>
<path class="ar" d="M430,82 H464" marker-end="url(#a)"/>
<rect class="bx-a" x="465" y="40" width="190" height="84" rx="5"/>
<text class="tt" x="560" y="70" text-anchor="middle">Submits a result</text>
<text class="sb" x="560" y="90" text-anchor="middle">against a schema: plan,</text>
<text class="sb" x="560" y="105" text-anchor="middle">checkpoint, review report</text>
<path class="ar" d="M656,82 H690" marker-end="url(#a)"/>
<rect class="bx" x="691" y="40" width="190" height="84" rx="5"/>
<text class="tt" x="786" y="70" text-anchor="middle">Code checks</text>
<text class="sb" x="786" y="90" text-anchor="middle">schema, paths, quotes;</text>
<text class="sb" x="786" y="105" text-anchor="middle">runs the tests itself</text>
<path class="ar" d="M882,82 H916" marker-end="url(#a)"/>
<rect class="bx" x="917" y="40" width="190" height="84" rx="5"/>
<text class="tt" x="1012" y="70" text-anchor="middle">Code changes the state</text>
<text class="sb" x="1012" y="90" text-anchor="middle">ticket transition, journal,</text>
<text class="sb" x="1012" y="105" text-anchor="middle">push, pull request, merge</text>
<text class="lb" x="899" y="30" text-anchor="middle">accepted</text>
<path class="ab" d="M786,124 V172 H334 V126" marker-end="url(#b)"/>
<text class="lb" x="560" y="166" text-anchor="middle">refused with a reason · the agent corrects and resubmits in the same run</text>
</svg>
