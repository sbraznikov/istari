name: istari ticket-link
description: The istari/ticket-link check. Fails a pull request whose branch and commits reference no open ticket (spec section 2.1).
inputs:
  token:
    description: A token that can read the repository's pull requests and issues.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../../go.mod
        cache: false
    - shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: go build -o "$RUNNER_TEMP/istari" ./cmd/istari
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: '"$RUNNER_TEMP/istari" ci ticket-link --repo "$REPO" --pr "$PR"'
