name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt-formatted:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      # Pinned here and in .istari/pipeline.toml (check lint); keep both alike.
      - name: install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          go install github.com/kisielk/errcheck@v1.9.0
      - run: staticcheck ./...
      - run: errcheck -exclude .errcheck-excludes ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=3 -short ./...
      # The tests that failed now and then in CI (#203), twenty times in a row.
      # The other two listed in #203 live on the unmerged branches of #178
      # and #164; #214 adds them here once those merge.
      - run: go test -race -count=20 -run '^TestTheRunnerKnowsWhichTaskItIsWorkingOn$' ./internal/runner/
      - run: go test -race -count=20 -run '^(TestAPullRequestClosedWithoutAMergeLeavesItsTicketAlone|TestAReviewRefusedForTheTicketsStateCostsNoAttempt)$' ./cmd/istari/
