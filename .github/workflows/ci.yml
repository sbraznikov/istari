name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy -diff
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt-formatted:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      # The linters in .golangci.yml; any report fails the job (#228).
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./...
      - run: go test ./...

  flaky:
    # The tests a pull request adds or changes, twenty times in a row (#265):
    # the last line of defense behind the checkpoint's flaky check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: new and changed tests, twenty times
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          files=$(git diff --name-only --diff-filter=d "$base" HEAD -- '*_test.go')
          BASE="$base" sh scripts/flaky.sh $files

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=3 -short ./...
      # The tests that failed now and then in CI (#203, #214), twenty times in a row.
      - run: go test -race -count=20 -run '^(TestAReviewRefusedForTheTicketsStateCostsNoAttempt)$' ./cmd/istari/
      # The end-to-end tests that step the daemon's loops (#250, #263, #279), fifty times in a row.
      # Fifty passes of these take over 20 minutes under -race: past go test's default 10m timeout.
      - run: go test -race -count=50 -timeout 60m -run '^(TestAPullRequestClosedWithoutAMergeLeavesItsTicketAlone|TestAPullRequestWhoseMergeableIsUnknownLeavesItsTicket|TestAPullRequestInConflictReturnsItsAwaitingApprovalTicketForRework|TestAPullRequestInConflictReturnsItsInReviewTicketAndCancelsTheReview|TestAPullRequestAHumanMergesFinishesItsTicketWhenTheWatchSeesItFirst|TestATicketAHumansMergeCanceledIsRepairedToDoneOnTheNextSync|TestARefusedSplitIsFixedAndResubmittedInTheSameRun|TestASteppedDaemonSyncsOnlyWhenAStepAsks|TestASteppedDaemonFiresADueTimerOnlyOnASchedulerStep|TestDoctorShowsTheLastHoursGitHubRequestsByKindAndTheQuotaLeft|TestAnImplementersCIUnrelatedAnswerRerunsTheRedHeadOnce|TestAScheduledActionRunsInTheDaemon|TestTheRunnerRunsAnAgentInTheTicketWorktreeWithItsToken|TestARunLeftRunningByADaemonRestartEndsOnStart|TestDoctorNamesTheSlotPausedBecauseItsHarnessDidNotStart|TestDoctorShowsTheUsageLimitPauseAndItsResetAndTheRunCostsNoAttempt|TestTheDaemonKeepsTicketWorktreesAndPrunesOrphans|TestATaskThatUsesUpItsAttemptsHoldsTheTicketUntilRetry|TestRecoverRebuildsTheLostDatabaseFromTheTracker|TestTicketCreateMakesAPlanOnceAndDepsPrintsItsTree|TestTicketCreateTakesThePriorityOfTheTicketsTable|TestAPlannerSubmitsAPlanOf20000CharactersThroughItsResultFile|TestAPlanCorrectedInTheSameRunCompletesThePlanTask|TestATicketAnAgentFilesIsCreatedByTheAgentInTail|TestAPlanSubmittedWhileGitHubRefusesForTheRateLimitCostsNoAttempt|TestARefineResultIsAcceptedThroughAShortServerOutage|TestARefineResultThatOutlastsTheRetriesCostsNoAttemptAndIsRedoneByTheNextRun|TestAPlanWhoseJournalEntryOutlastsTheRetriesCostsNoAttemptAndIsRedone|TestAReviewTheCodeHostCannotTakeCostsNoAttemptAndIsRedone|TestARefusalOfTheTrackerStillRefusesTheRefineResult|TestAReviewersFindingIsPublishedAndReturnsTheTicketForRework|TestAReportCorrectedInTheSameRunCompletesTheReview|TestAReviewerCannotCompleteWithoutAReport|TestAReviewRefusedForTheTicketsStateCostsNoAttempt|TestAReviewRefusedForAYAMLErrorStillCostsAnAttempt|TestOnlyAnImplementerMayAnswerCIUnrelated|TestARefineResultCorrectedInTheSameRunCompletesTheRefineTask|TestAReadyTicketBecomesADraftPullRequest|TestAnImplementersCompleteWithoutAPullRequestIsRefusedAndItsTaskReleased|TestLiftingTheMainRedHoldStartsAnImplementRunThatOpensThePullRequest|TestIstariSyncMirrorsTheTrackersIssues|TestTicketReadyAdmitsForATrustedMemberOnly|TestTicketPrioritySetsTheLabelForAHumanOnly|TestARawTicketOfAnOutsiderIsRefinedOnlyAfterATrustedReady)$' ./cmd/istari/
      # The runner tests that set a lease, a stop checkpoint limit or a
      # deadline (#203, #214, #263, #278), fifty times in a row.
      - run: go test -race -count=50 -timeout 30m -run '^(TestARunWhosePreparationOutlastsTheLeaseStillStarts|TestTheRunnerKnowsWhichTaskItIsWorkingOn|TestTheLeaseIsRenewedWhileTheRunLivesAndTheTokenDiesWithIt|TestTheRefinerReadsTheMainBranchWithoutATicketWorktree|TestAStoppingRunKeepsItsLeaseWhileItsCheckpointOutlastsIt|TestAStopCheckpointPastItsLimitIsAbandonedAndTheWorkStaysInTheWorktree|TestAStopCheckpointWhosePushHangsPastItsLimitIsAbandoned|TestAStopCheckpointWhosePushOutlastsItsLimitIsKept|TestAfterTheRunnerIsKilledTheTaskExpiresAndAnotherSlotTakesIt)$' ./internal/runner/
