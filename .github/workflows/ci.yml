name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt-formatted:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=3 -short ./...
      # The tests that failed now and then in CI (#203, #214), twenty times in a row.
      - run: go test -race -count=20 -run '^(TestTheRunnerKnowsWhichTaskItIsWorkingOn|TestAStopCheckpointWhosePushOutlastsItsLimitIsKept)$' ./internal/runner/
      - run: go test -race -count=20 -run '^(TestAReviewRefusedForTheTicketsStateCostsNoAttempt)$' ./cmd/istari/
      # The end-to-end tests that step the daemon's loops (#250), fifty times in a row.
      - run: go test -race -count=50 -run '^(TestAPullRequestClosedWithoutAMergeLeavesItsTicketAlone|TestAPullRequestWhoseMergeableIsUnknownLeavesItsTicket|TestAPullRequestInConflictReturnsItsAwaitingApprovalTicketForRework|TestAPullRequestInConflictReturnsItsInReviewTicketAndCancelsTheReview|TestAPullRequestAHumanMergesFinishesItsTicketWhenTheWatchSeesItFirst|TestATicketAHumansMergeCanceledIsRepairedToDoneOnTheNextSync|TestARefusedSplitIsFixedAndResubmittedInTheSameRun|TestASteppedDaemonSyncsOnlyWhenAStepAsks|TestASteppedDaemonFiresADueTimerOnlyOnASchedulerStep)$' ./cmd/istari/
