name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files not gofmt-formatted:"
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  flaky:
    # The tests a pull request adds or changes, twenty times in a row (#265):
    # the last line of defense behind the checkpoint's flaky check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: new and changed tests, twenty times
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          files=$(git diff --name-only --diff-filter=d "$base" HEAD -- '*_test.go')
          BASE="$base" sh scripts/flaky.sh $files

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=3 -short ./...
      # The tests that failed now and then in CI (#203, #214), twenty times in a row.
      - run: go test -race -count=20 -run '^(TestTheRunnerKnowsWhichTaskItIsWorkingOn|TestAStopCheckpointWhosePushOutlastsItsLimitIsKept)$' ./internal/runner/
      - run: go test -race -count=20 -run '^(TestAReviewRefusedForTheTicketsStateCostsNoAttempt)$' ./cmd/istari/
      # The end-to-end tests that step the daemon's loops (#250, #263), fifty times in a row.
      - run: go test -race -count=50 -run '^(TestAPullRequestClosedWithoutAMergeLeavesItsTicketAlone|TestAPullRequestWhoseMergeableIsUnknownLeavesItsTicket|TestAPullRequestInConflictReturnsItsAwaitingApprovalTicketForRework|TestAPullRequestInConflictReturnsItsInReviewTicketAndCancelsTheReview|TestAPullRequestAHumanMergesFinishesItsTicketWhenTheWatchSeesItFirst|TestATicketAHumansMergeCanceledIsRepairedToDoneOnTheNextSync|TestARefusedSplitIsFixedAndResubmittedInTheSameRun|TestASteppedDaemonSyncsOnlyWhenAStepAsks|TestASteppedDaemonFiresADueTimerOnlyOnASchedulerStep|TestDoctorShowsTheLastHoursGitHubRequestsByKindAndTheQuotaLeft|TestAnImplementersCIUnrelatedAnswerRerunsTheRedHeadOnce)$' ./cmd/istari/
      # The runner test whose preparation outlasts its lease (#263), fifty times in a row.
      - run: go test -race -count=50 -run '^TestARunWhosePreparationOutlastsTheLeaseStillStarts$' ./internal/runner/
